<!DOCTYPE html>
<html>
<head>
  <title>Teams AI Reply Assistant Options</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      max-width: 400px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    select, input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background-color: #5B5FC7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }
    button:hover {
      background-color: #4a4d9e;
    }
    #status {
      margin-top: 10px;
      color: green;
      font-weight: 600;
      text-align: center;
      min-height: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Settings</h2>

  <div class="form-group">
    <label for="provider">Active Provider:</label>
    <select id="provider">
      <option value="ollama">Ollama (Local)</option>
      <option value="gemini">Google Gemini</option>
    </select>
  </div>

  <div id="ollamaSettings" class="form-group">
    <label for="ollamaModel">Ollama Model Name:</label>
    <input type="text" id="ollamaModel" placeholder="e.g., llama3" value="llama3">
  </div>

  <div id="geminiSettings" class="form-group hidden">
    <div style="margin-bottom: 10px;">
      <label for="geminiModel">Gemini Model Name:</label>
      <input type="text" id="geminiModel" placeholder="e.g., gemini-2.5-flash" value="gemini-2.5-flash">
    </div>
    <div>
      <label for="geminiApiKey">Google Studio API Key:</label>
      <input type="password" id="geminiApiKey" placeholder="Enter Gemini API Key">
    </div>
  </div>

  <button id="save">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
